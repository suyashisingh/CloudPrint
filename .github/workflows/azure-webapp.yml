name: Build, test, and deploy CloudPrint

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: cloudprint-suyashi # Set this to your Azure Web App name.
  DOTNET_VERSION: '8.0.x'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore CloudPrint.sln
      - run: dotnet test CloudPrint.sln --no-restore --configuration Release
      - run: dotnet publish src/CloudPrint.Api/CloudPrint.Api.csproj -c Release -o publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
